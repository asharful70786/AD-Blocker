<!DOCTYPE html>
<html>

<head>
  <title>Adblocker by Bitto</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 p-4 w-64">
  <div class="text-center mb-4">
    <h1 class="text-xl font-bold text-blue-600">Ad_blocker by CoderCamp</h1>
    <p class="text-sm text-gray-500">Your personal ad-blocking assistant</p>
  </div>

  <div class="bg-white shadow-md rounded-lg p-4 mb-4">
    <p>Total Ads Blocked:</p>
    <p id="adCount" class="text-2xl font-bold text-red-500">0</p>
  </div>

  <div class="flex justify-center">
    <button id="resetCount" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
      Reset Count
    </button>
  </div>
</body>
<script src="popup.js"></script>

</html>
